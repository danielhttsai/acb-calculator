<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>ACB Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="https://phd-center.github.io/acb-calculator/">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #ffffff; }
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .logo { max-width: min(80vw, 600px); max-height: 50vh; opacity: 0; animation: flash 1s ease-out forwards; }
    @keyframes flash {
      0%   { opacity: 0; transform: scale(0.98); }
      40%  { opacity: 1; transform: scale(1); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <img class="logo" src="phdc-logo.png" alt="Population Health Data Center NCKU">
  <script>
    // Keep query string & hash on redirect (e.g. ?lang=en, #section)
    var target = 'https://phd-center.github.io/acb-calculator/' + (location.search || '') + (location.hash || '');
    setTimeout(function() { location.replace(target); }, 1100);
  </script>
</body>
</html>
